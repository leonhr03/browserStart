<!doctype html>
<html class="no-js" lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="Persönliche Browser-Startseite mit Schnelllinks und Suche.">

  <meta property="og:title" content="Start">
  <meta property="og:type" content="website">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#eef2ff">

  <script>
    (function () {
      var t;
      try {
        t = localStorage.getItem('bs.theme');
      } catch (e) {}
      if (!t) {
        t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">L</span>
      <span class="brand-name">Leon</span>
    </div>
    <div class="topbar-actions">
      <span class="topbar-shortcut" title="Tastenkürzel: / — Suche fokussieren">
        <kbd>/</kbd>
      </span>
      <button id="btnAddLink" class="icon-btn" type="button" title="Eigenen Link hinzufügen" aria-label="Eigenen Link hinzufügen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="btnTheme" class="icon-btn" type="button" title="Dunkelmodus umschalten (d)" aria-label="Dunkelmodus umschalten">
        <svg id="iconMoon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
        <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="hero">
      <p class="greeting" id="greeting">Guten Tag</p>
      <time class="clock" id="clock">--:--</time>
      <p class="date" id="date"></p>
    </section>

    <section class="search" aria-label="Suche">
      <form class="search-box" id="searchForm">
        <span class="engine-wrap">
          <select id="engine" class="engine-select" aria-label="Suchmaschine wählen">
            <option value="google">Google</option>
            <option value="duckduckgo">DuckDuckGo</option>
            <option value="bing">Bing</option>
            <option value="github">GitHub</option>
            <option value="youtube">YouTube</option>
            <option value="npm">npm</option>
          </select>
          <svg viewBox="0 0 10 6" aria-hidden="true"><path d="M0 0l5 6 5-6z" fill="currentColor"/></svg>
        </span>
        <input id="searchInput" type="search" placeholder="Suche…" autocomplete="off" spellcheck="false" aria-label="Suchbegriff">
        <button class="search-btn" type="submit" aria-label="Suchen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4.5 4.5"/></svg>
        </button>
      </form>
    </section>

    <section class="links" aria-label="Programmier-Links">
      <div class="tiles" id="devTiles"></div>
    </section>

    <section class="links quick-section hidden" id="quickSection" aria-label="Eigene Links">
      <h2 class="section-title">Eigene Links</h2>
      <div class="tiles" id="quickTiles"></div>
    </section>

    <section class="widgets">
      <div class="widget">
        <h2 class="section-title">ToDo</h2>
        <form class="todo-form" id="todoForm">
          <input id="todoInput" type="text" placeholder="Neue Aufgabe…" autocomplete="off" aria-label="Neue Aufgabe">
          <button type="submit" aria-label="Aufgabe hinzufügen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </form>
        <ul class="todo-list" id="todoList"></ul>
      </div>
      <div class="widget">
        <h2 class="section-title">Notizen</h2>
        <textarea id="notes" rows="7" placeholder="Schnelle Notiz…"></textarea>
      </div>
    </section>
  </main>

  <footer class="footer">
    <ul class="hints">
      <li><kbd>/</kbd> Suche fokussieren</li>
      <li><kbd>t</kbd> ToDo-Feld</li>
      <li><kbd>d</kbd> Dunkelmodus</li>
      <li><kbd>Esc</kbd> Fenster schließen</li>
    </ul>
    <p class="footer-note">Mehr über new tab page im <code>Dok</code>-Block von <code>js/app.js</code></p>
  </footer>

  <dialog id="addLinkDialog" class="dialog" aria-label="Link hinzufügen">
    <form id="addLinkForm" novalidate>
      <h3 class="dialog-title">Eigenen Link hinzufügen</h3>
      <label class="field">
        <span>Name</span>
        <input id="linkName" type="text" placeholder="z. B. Stack Overflow" required autocomplete="off">
      </label>
      <label class="field">
        <span>URL</span>
        <input id="linkUrl" type="text" placeholder="https://example.de" required autocomplete="off">
      </label>
      <p class="form-error hidden" id="linkError" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="btn-ghost" id="btnCancelLink">Abbrechen</button>
        <button type="submit" class="btn-primary">Hinzufügen</button>
      </div>
    </form>
  </dialog>

  <script src="js/app.js"></script>
</body>

</html>
